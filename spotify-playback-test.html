<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playback Test</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","PingFang SC",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:30px 20px;
}

.card{
  width:min(460px,100%);
  margin:auto;
  padding:26px 22px;
  border-radius:28px;
  background:#1c1c1c;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.tip{
  color:#aaa;
  line-height:1.6;
  margin-bottom:20px;
}

.status{
  padding:14px 16px;
  margin-bottom:18px;
  border-radius:18px;
  background:#272727;
  color:#ccc;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

input{
  width:100%;
  height:48px;
  border:0;
  outline:0;
  border-radius:16px;
  padding:0 16px;
  background:#292929;
  color:#fff;
  font-size:15px;
  margin-bottom:12px;
}

button{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:24px;
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
}

button:disabled{
  opacity:.4;
}

.green{
  background:#1ed760;
  color:#000;
}

.dark{
  background:#333;
  color:#fff;
}

.small{
  color:#888;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="card">

  <h1>Spotify Playback</h1>

  <div class="tip">
    测试 Spotify Web Playback SDK
  </div>

  <div class="status" id="status">
    页面已启动，准备加载 Spotify SDK…
  </div>

  <button class="green" id="activateBtn" disabled>
    激活 Spotify 播放器
  </button>

  <input
    id="trackInput"
    placeholder="粘贴 Spotify 歌曲链接"
  >

  <button class="green" id="playBtn" disabled>
    播放这首歌
  </button>

  <button class="dark" id="toggleBtn" disabled>
    播放 / 暂停
  </button>

  <button class="dark" id="prevBtn" disabled>
    上一首
  </button>

  <button class="dark" id="nextBtn" disabled>
    下一首
  </button>

  <div class="small">
    这个页面会显示 Spotify SDK 实际卡在哪一步。
  </div>

</div>

<script>
(() => {

  const $ = s => document.querySelector(s);

  const status = $('#status');

  let player = null;
  let deviceId = null;

  let sdkReadyCalled = false;
  let playerStarted = false;


  function setStatus(text){
    status.textContent = text;
  }


  function token(){
    return localStorage.getItem(
      'spotify_access_token'
    );
  }


  function expired(){

    const at = Number(
      localStorage.getItem(
        'spotify_expires_at'
      ) || 0
    );

    return !!(
      at &&
      Date.now() >= at
    );
  }


  function enableControls(){

    $('#activateBtn').disabled = false;
    $('#playBtn').disabled = false;
    $('#toggleBtn').disabled = false;
    $('#prevBtn').disabled = false;
    $('#nextBtn').disabled = false;

  }


  async function spotifyApi(
    path,
    options={}
  ){

    const response = await fetch(
      'https://api.spotify.com/v1' + path,
      {
        ...options,

        headers:{
          Authorization:
            'Bearer ' + token(),

          ...(options.body
            ? {
                'Content-Type':
                'application/json'
              }
            : {}),

          ...(options.headers || {})
        }
      }
    );


    if(response.status === 204){
      return null;
    }


    let data = null;

    try{
      data = await response.json();
    }catch(_){}


    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        'Spotify HTTP ' +
        response.status
      );

    }


    return data;
  }


  function parseTrack(value){

    value =
      String(value || '').trim();


    if(!value){
      return null;
    }


    if(
      value.startsWith(
        'spotify:track:'
      )
    ){
      return value;
    }


    try{

      const url =
        new URL(value);

      const match =
        url.pathname.match(
          /\/track\/([A-Za-z0-9]+)/
        );

      if(match){

        return (
          'spotify:track:' +
          match[1]
        );

      }

    }catch(_){}


    if(
      /^[A-Za-z0-9]{10,}$/.test(value)
    ){

      return (
        'spotify:track:' +
        value
      );

    }


    return null;
  }


  async function startPlayer(){

    if(playerStarted){
      return;
    }

    playerStarted = true;


    if(!window.Spotify?.Player){

      setStatus(
        '❌ SDK 回调已经执行，但 Spotify.Player 不存在'
      );

      return;
    }


    if(!token()){

      setStatus(
        '❌ 没有 Spotify Token\n请先回 spotify-test.html 登录'
      );

      return;
    }


    if(expired()){

      setStatus(
        '❌ Spotify Token 已经过期\n请重新登录'
      );

      return;
    }


    setStatus(
      '✅ Spotify SDK 已初始化\n正在创建播放器…'
    );


    try{

      player =
        new Spotify.Player({

          name:
            'Apple Music can',

          getOAuthToken:
            cb => {

              const t = token();

              setStatus(
                'Spotify 正在请求登录 Token…'
              );

              cb(t);

            },

          volume:0.6,

          enableMediaSession:true

        });


      player.addListener(
        'ready',
        ({device_id}) => {

          deviceId =
            device_id;

          setStatus(
            '✅ Spotify 播放设备准备完成！\n\n' +
            'Device ID：\n' +
            deviceId +
            '\n\n现在点击「激活 Spotify 播放器」'
          );

          enableControls();

        }
      );


      player.addListener(
        'not_ready',
        ({device_id}) => {

          setStatus(
            '⚠️ Spotify 设备离线\n' +
            device_id
          );

        }
      );


      player.addListener(
        'initialization_error',
        ({message}) => {

          setStatus(
            '❌ initialization_error\n' +
            message
          );

        }
      );


      player.addListener(
        'authentication_error',
        ({message}) => {

          setStatus(
            '❌ authentication_error\n' +
            message +
            '\n\n请重新登录 Spotify'
          );

        }
      );


      player.addListener(
        'account_error',
        ({message}) => {

          setStatus(
            '❌ account_error\n' +
            message +
            '\n\n通常表示当前账号不满足 Web Playback SDK 播放条件'
          );

        }
      );


      player.addListener(
        'playback_error',
        ({message}) => {

          setStatus(
            '❌ playback_error\n' +
            message
          );

        }
      );


      player.addListener(
        'player_state_changed',
        state => {

          if(!state){
            return;
          }


          const track =
            state.track_window
              ?.current_track;


          if(track){

            setStatus(
              (
                state.paused
                  ? '⏸️ '
                  : '▶️ '
              ) +

              track.name +

              '\n' +

              (
                track.artists
                ?.map(x=>x.name)
                .join(' / ')
                || ''
              )
            );

          }

        }
      );


      setStatus(
        '播放器对象已创建\n正在执行 player.connect()…'
      );


      const connected =
        await player.connect();


      if(connected){

        setStatus(
          '✅ player.connect() 成功\n正在等待 Spotify 返回 Device ID…'
        );

      }else{

        setStatus(
          '❌ player.connect() 返回 false'
        );

      }


    }catch(error){

      setStatus(
        '❌ 创建播放器异常\n' +
        error.message
      );

    }

  }


  /*
    关键：
    在加载 Spotify SDK 之前，
    先注册 Ready 回调。
  */

  window.onSpotifyWebPlaybackSDKReady =
    () => {

      sdkReadyCalled = true;

      setStatus(
        '✅ onSpotifyWebPlaybackSDKReady 已触发\n正在初始化播放器…'
      );

      startPlayer();

    };


  /*
    现在才加载 SDK
  */

  const script =
    document.createElement('script');

  script.src =
    'https://sdk.scdn.co/spotify-player.js';

  script.async = true;


  script.onload =
    () => {

      if(
        !sdkReadyCalled &&
        window.Spotify?.Player
      ){

        setStatus(
          '✅ SDK 文件加载成功\n检测到 Spotify.Player\n正在手动初始化…'
        );

        startPlayer();

      }else if(
        !sdkReadyCalled
      ){

        setStatus(
          'SDK 文件已经下载\n等待 Spotify SDK Ready 回调…'
        );

      }

    };


  script.onerror =
    () => {

      setStatus(
        '❌ spotify-player.js 加载失败'
      );

    };


  document.head.appendChild(
    script
  );


  setTimeout(
    () => {

      if(!playerStarted){

        setStatus(
          '❌ 等待 10 秒仍未初始化\n\n' +
          'SDK文件：' +
          (
            window.Spotify
              ? '已存在'
              : '不存在'
          ) +
          '\nReady回调：' +
          (
            sdkReadyCalled
              ? '已触发'
              : '未触发'
          )
        );

      }

    },
    10000
  );


  async function activate(){

    if(
      !player ||
      !deviceId
    ){

      throw new Error(
        'Spotify 设备还没有准备完成'
      );

    }


    await player.activateElement();


    await spotifyApi(
      '/me/player',
      {
        method:'PUT',

        body:JSON.stringify({
          device_ids:[
            deviceId
          ],

          play:false
        })
      }
    );


    setStatus(
      '✅ Spotify 播放器已激活'
    );

  }


  async function playInputTrack(){

    const uri =
      parseTrack(
        $('#trackInput').value
      );


    if(!uri){

      throw new Error(
        'Spotify 歌曲链接不正确'
      );

    }


    await player.activateElement();


    await spotifyApi(
      '/me/player',
      {
        method:'PUT',

        body:JSON.stringify({
          device_ids:[
            deviceId
          ],

          play:false
        })
      }
    );


    await spotifyApi(
      '/me/player/play?device_id=' +
      encodeURIComponent(
        deviceId
      ),
      {
        method:'PUT',

        body:JSON.stringify({
          uris:[uri]
        })
      }
    );


    setStatus(
      '▶️ 播放命令已发送\n' +
      uri
    );

  }


  $('#activateBtn').onclick =
    async () => {

      try{

        await activate();

      }catch(e){

        setStatus(
          '❌ ' + e.message
        );

      }

    };


  $('#playBtn').onclick =
    async () => {

      try{

        await playInputTrack();

      }catch(e){

        setStatus(
          '❌ ' + e.message
        );

      }

    };


  $('#toggleBtn').onclick =
    async () => {

      try{

        await player.activateElement();
        await player.togglePlay();

      }catch(e){

        setStatus(
          '❌ ' + e.message
        );

      }

    };


  $('#prevBtn').onclick =
    async () => {

      try{

        await player.previousTrack();

      }catch(e){

        setStatus(
          '❌ ' + e.message
        );

      }

    };


  $('#nextBtn').onclick =
    async () => {

      try{

        await player.nextTrack();

      }catch(e){

        setStatus(
          '❌ ' + e.message
        );

      }

    };

})();
</script>

</body>
</html>
