<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify 登录测试</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#111;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:min(430px,100%);
      padding:28px 22px;
      background:#1c1c1c;
      border-radius:26px;
    }

    h1{
      margin:0 0 8px;
      font-size:26px;
    }

    .sub{
      margin:0 0 22px;
      color:#aaa;
      line-height:1.6;
      font-size:14px;
    }

    button{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:24px;
      background:#1ed760;
      color:#000;
      font-size:16px;
      font-weight:700;
    }

    #result{
      margin-top:20px;
      padding:16px;
      border-radius:18px;
      background:#262626;
      line-height:1.7;
      font-size:14px;
      word-break:break-word;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Spotify</h1>

  <p class="sub">
    先测试 Spotify PKCE 登录和账号读取。
  </p>

  <button id="loginBtn">
    登录 Spotify
  </button>

  <div id="result">
    尚未登录
  </div>
</div>

<script>
(() => {

  /* 只改这一行 */
  const CLIENT_ID = 'd5f1672f1e2746058e0e1a25016406d7';

  const REDIRECT_URI =
    'https://karenbrow085-debug.github.io/spotifycan/spotify-callback.html';

  const SCOPES = [
    'user-read-private',
    'user-read-email',

    'playlist-read-private',
    'playlist-read-collaborative',

    'user-library-read',

    'streaming',

    'user-read-playback-state',
    'user-modify-playback-state'
  ].join(' ');

  const $ = s => document.querySelector(s);

  function randomString(length = 64){
    const chars =
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';

    const values =
      crypto.getRandomValues(new Uint8Array(length));

    return Array.from(
      values,
      x => chars[x % chars.length]
    ).join('');
  }

  async function sha256(text){
    return crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(text)
    );
  }

  function base64Url(buffer){
    return btoa(
      String.fromCharCode(...new Uint8Array(buffer))
    )
      .replace(/=/g,'')
      .replace(/\+/g,'-')
      .replace(/\//g,'_');
  }

  async function startLogin(){

    $('#result').textContent =
      '正在准备 Spotify 登录…';

    const verifier = randomString(64);

    const challenge =
      base64Url(await sha256(verifier));

    const state = randomString(32);

    localStorage.setItem(
      'spotify_code_verifier',
      verifier
    );

    localStorage.setItem(
      'spotify_oauth_state',
      state
    );

    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      code_challenge_method: 'S256',
      code_challenge: challenge,
      state,
      scope: SCOPES
    });

    const url =
      'https://accounts.spotify.com/authorize?' +
      params.toString();

    const popup = window.open(
      url,
      'spotify-login'
    );

    if(!popup){
      location.href = url;
    }
  }

  async function exchangeCode(code){

    const verifier =
      localStorage.getItem(
        'spotify_code_verifier'
      );

    if(!verifier){
      throw new Error(
        '找不到 PKCE verifier，请重新登录'
      );
    }

    const body = new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    });

    const response = await fetch(
      'https://accounts.spotify.com/api/token',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/x-www-form-urlencoded'
        },
        body
      }
    );

    const data = await response.json();

    if(!response.ok || !data.access_token){
      throw new Error(
        data.error_description ||
        data.error ||
        '获取 Spotify Token 失败'
      );
    }

    localStorage.setItem(
      'spotify_access_token',
      data.access_token
    );

    if(data.refresh_token){
      localStorage.setItem(
        'spotify_refresh_token',
        data.refresh_token
      );
    }

    localStorage.setItem(
      'spotify_expires_at',
      String(
        Date.now() +
        Number(data.expires_in || 3600) * 1000
      )
    );

    return data.access_token;
  }

  async function loadProfile(token){

    const response = await fetch(
      'https://api.spotify.com/v1/me',
      {
        headers:{
          Authorization:
            'Bearer ' + token
        }
      }
    );

    const user = await response.json();

    if(!response.ok){
      throw new Error(
        user.error?.message ||
        '读取 Spotify 账号失败'
      );
    }

    $('#result').textContent =
      '✅ Spotify 登录成功\n\n' +
      '昵称：' +
      (user.display_name || '未设置') +
      '\n账号 ID：' +
      (user.id || user.account_id || '未知') +
      '\n邮箱：' +
      (user.email || '未返回');

    return user;
  }

  window.addEventListener(
    'message',
    async event => {

      if(
        event.origin !==
        'https://karenbrow085-debug.github.io'
      ){
        return;
      }

      const data = event.data;

      if(
        !data ||
        data.type !==
        'spotify-oauth-callback'
      ){
        return;
      }

      try{

        if(data.error){
          throw new Error(
            'Spotify 授权失败：' +
            data.error
          );
        }

        const expectedState =
          localStorage.getItem(
            'spotify_oauth_state'
          );

        if(
          !data.state ||
          data.state !== expectedState
        ){
          throw new Error(
            'Spotify state 校验失败'
          );
        }

        $('#result').textContent =
          '授权成功，正在获取 Token…';

        const token =
          await exchangeCode(data.code);

        $('#result').textContent =
          'Token 获取成功，正在读取账号…';

        await loadProfile(token);

      }catch(error){

        $('#result').textContent =
          '❌ ' + error.message;

      }

    }
  );

  $('#loginBtn').onclick =
    startLogin;

})();
</script>

</body>
</html>
